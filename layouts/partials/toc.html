{{ if strings.Contains .TableOfContents "<li" }}
<details class="toc mb-10 rounded-xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 p-4">
    <summary class="cursor-pointer select-none text-sm font-bold text-gray-600 dark:text-gray-300 tracking-wide">
        {{ i18n "tableOfContents" }}
    </summary>
    <nav class="toc-body mt-4 text-sm leading-relaxed">
        {{ .TableOfContents }}
    </nav>
</details>
{{ end }}
